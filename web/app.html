<title>TetraCubeDB — Workspace</title>
<style>
  :root{
    --ink:#0b0d13; --ink-2:#10131c; --surface:#151926; --surface-2:#1b2030; --line:#262c3d;
    --brass:#c9a24c; --brass-hi:#e7cd86; --verify:#5fd0c4; --paper:#f2f1ec; --mist:#9aa2b4;
    --mist-dim:#6b7385; --bad:#e78a7a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono)} a{color:var(--verify)}
  header.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(11,13,19,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}.brand b{color:var(--brass)}.brand svg{width:22px;height:22px}
  .nav-tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mist-dim)}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 24px 80px}

  .drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--ink-2);padding:34px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover,.drop.hot{border-color:var(--brass);background:rgba(201,162,76,.05)}
  .drop svg{width:28px;height:28px;color:var(--brass)}.drop .big{color:var(--paper);font-size:1.02rem;margin-top:8px}
  .drop .or{font-size:.85rem;color:var(--mist-dim);margin-top:6px}
  .link{background:none;border:none;color:var(--verify);font:inherit;cursor:pointer;padding:0;border-bottom:1px solid rgba(95,208,196,.35)}

  .out{margin-top:22px}.out[hidden]{display:none}
  .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.82rem;margin-bottom:16px}
  .crumb{color:var(--verify);cursor:pointer;border:none;background:none;font:inherit;padding:0}
  .crumb.here{color:var(--paper);cursor:default}
  .crumb .d{color:var(--mist-dim)} .csep{color:var(--mist-dim)}

  .lead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .lead h2{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:-.01em}
  .lead .fn{font-family:var(--mono);color:var(--mist);font-size:.84rem}
  .teach{color:var(--mist-dim);font-size:.82rem;margin:0 0 16px}

  .dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .dim{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .dim .dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
  .dim .dn{font-weight:600;font-size:1rem}.dim .dc{font-family:var(--mono);font-size:.68rem;color:var(--mist-dim);letter-spacing:.1em;text-transform:uppercase}
  .members{display:flex;flex-wrap:wrap;gap:7px}
  .mem{font-family:var(--mono);font-size:.8rem;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--paper);cursor:pointer;transition:border-color .15s,background .15s}
  .mem:hover{border-color:var(--brass);background:rgba(201,162,76,.07)}
  .mem b{color:var(--brass-hi)} .mem .n{color:var(--mist-dim);margin-left:6px}
  .more{color:var(--mist-dim);font-family:var(--mono);font-size:.74rem;align-self:center}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .panel{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
  .panel .ph h3{margin:0;font-size:1rem;font-weight:600}.panel .ph .hint{color:var(--mist-dim);font-family:var(--mono);font-size:.68rem}
  .pb{padding:15px 16px}
  .btn{font-family:var(--sans);font-weight:600;font-size:.84rem;border:none;cursor:pointer;border-radius:8px;padding:9px 15px;background:var(--brass);color:#1a1406}
  .btn:hover{background:var(--brass-hi)} .btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
  .sel,.inp{background:var(--surface);border:1px solid var(--line);color:var(--paper);font-family:var(--mono);font-size:.84rem;padding:8px 10px;border-radius:8px}
  .sel:focus,.inp:focus{outline:none;border-color:var(--brass)}
  .lookrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-family:var(--mono);font-size:.84rem;margin-top:12px}
  .kv .k{color:var(--mist)}.kv .v{color:var(--paper)} .addr{font-family:var(--mono);font-size:.72rem;color:var(--verify);margin-top:10px}
  .empty{color:var(--mist-dim);font-size:.86rem}

  /* compression = the OMG */
  .comp{margin-top:16px;border:1px solid rgba(201,162,76,.4);border-radius:13px;background:rgba(201,162,76,.05);padding:18px 18px}
  .comp .big{font-size:2rem;font-weight:600;color:var(--brass-hi);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .comp .cl{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
  .comp .sub{color:var(--mist);font-size:.9rem;margin-top:4px}
  .comp .act{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bloomed{color:var(--verify);font-family:var(--mono);font-size:.82rem;display:flex;align-items:center;gap:8px}
  .bloomed svg{width:16px;height:16px}

  .an{margin-top:12px} .rel{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.9rem;margin:6px 0}
  .pill{font-family:var(--mono);font-size:.78rem;padding:3px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line)} .pill.ent{border-color:rgba(201,162,76,.45);color:var(--brass-hi)}
  .rel .arr{color:var(--mist-dim)}.rel .desc{color:var(--mist);font-size:.82rem}

  details.data{margin-top:16px;border:1px solid var(--line);border-radius:13px;background:var(--ink-2)}
  details.data>summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:.95rem;list-style:none}
  details.data>summary::-webkit-details-marker{display:none}
  details.data>summary::before{content:'▸ ';color:var(--mist-dim)} details.data[open]>summary::before{content:'▾ '}
  .tblwrap{overflow:auto;max-height:360px;border-top:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.78rem}
  th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--surface-2);color:var(--brass);font-weight:600;z-index:1}
  td{color:var(--paper)} td.num{color:var(--verify);text-align:right} tr:hover td{background:rgba(201,162,76,.04)}
  .proc{color:var(--verify);font-family:var(--mono);font-size:.9rem;padding:26px 0;text-align:center}
  .foot{color:var(--mist-dim);font-family:var(--mono);font-size:.7rem;text-align:center;margin-top:26px}

  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .45s,visibility .45s;background:radial-gradient(1200px 700px at 50% -10%,rgba(201,162,76,.10),transparent 60%),var(--ink)}
  #gate.open{opacity:0;visibility:hidden;pointer-events:none}
  .gate-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .gate-title{font-size:1.4rem;font-weight:600}.gate-title b{color:var(--brass)} .gate-sub{color:var(--mist);font-size:.9rem;margin-top:-6px}
  .field{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--paper);font-family:var(--mono);font-size:.92rem;letter-spacing:.06em;padding:12px 14px;border-radius:9px}
  .field:focus{outline:none;border-color:var(--brass)} .gate-err{color:var(--bad);font-family:var(--mono);font-size:.76rem;min-height:1em}
  .gate-foot{color:var(--mist-dim);font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
</style>

<div id="gate">
  <div class="gate-card">
    <div><div class="gate-title">Tetra<b>Cube</b>DB</div><div class="gate-sub">Private preview. Sign in to continue.</div></div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px">
      <input id="user" class="field" type="text" autocomplete="username" spellcheck="false" placeholder="Username" aria-label="Username">
      <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button class="btn" id="enter" style="width:100%">Sign in</button>
      <div class="gate-err" id="err"></div>
    </div>
    <div class="gate-foot">tetracubedb.us</div>
  </div>
</div>

<header class="nav">
  <div class="brand">
    <svg viewBox="0 0 100 100" fill="none"><rect x="24" y="24" width="52" height="52" stroke="#c9a24c" stroke-width="3" opacity=".5"/><rect x="12" y="12" width="52" height="52" stroke="#e7cd86" stroke-width="3.4"/></svg>
    <span>Tetra<b>Cube</b>DB</span>
  </div>
  <span class="nav-tag">Workspace</span>
</header>

<div class="wrap">
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add a dataset">
    <input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <div class="big">Drop a dataset (CSV or JSON), or <button class="link" id="pick" type="button">choose one</button></div>
    <div class="or">or try public data: <span id="samples"></span></div>
  </div>
  <div class="out" id="out" hidden></div>
  <div class="foot">TetraCubeDB &middot; runs entirely on your machine &middot; tetracubedb.us</div>
</div>

<script>
  (function(){
    var USER='admin', PASS='pp&pgroup';
    var gate=document.getElementById('gate'), uEl=document.getElementById('user'), pEl=document.getElementById('pass'), err=document.getElementById('err');
    function unlock(){ gate.classList.add('open'); try{ sessionStorage.setItem('tcdb_in','1'); }catch(e){} }
    function attempt(){ var u=(uEl.value||'').trim().toLowerCase(), p=(pEl.value||'');
      if(u===USER && p===PASS){ err.textContent=''; unlock(); } else { err.textContent='Username or password not recognized.'; pEl.focus(); pEl.select(); } }
    document.getElementById('enter').addEventListener('click', attempt);
    [uEl,pEl].forEach(function(el){ el.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); }); });
    try{ if(sessionStorage.getItem('tcdb_in')==='1') unlock(); }catch(e){}
    setTimeout(function(){ uEl.focus(); }, 200);
  })();
</script>

<script type="module">
  import { analyzeDataset, parseCSV } from '../src/index.mjs';

  const out = document.getElementById('out'), fileEl = document.getElementById('file'), drop = document.getElementById('drop');
  let DATA=null, REPORT=null, NAME='', DRILL=[];   // DRILL = [{dim, value}, ...] the path we drilled

  const esc = s => String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const isNum = v => v!==null && v!=='' && v!==undefined && Number.isFinite(Number(v));

  // ---- ingest ----
  function analyze(rows, name){
    DATA=rows; NAME=name; DRILL=[];
    out.hidden=false; out.innerHTML='<div class="proc">Organizing '+esc(name)+' &hellip;</div>';
    setTimeout(()=>{ try{ REPORT=analyzeDataset(rows); renderNav(); }catch(e){ out.innerHTML='<div class="proc">Could not read that file. '+esc(e.message||'')+'</div>'; } }, 240);
  }

  // ---- the dimensional model ----
  // A DIMENSION is a type/category you drill into (studio, genre, sector), not a unique identity.
  // Identities (keys: order_id, vin) address one record. Relationships are built on demand by drilling.
  function facets(){
    // A dimension is a type you NAVIGATE (its name is the point; what it is stays latent until you
    // drill). So exclude identities (keys), exclude entity attributes (they live inside their entity
    // dimension), and exclude continuous measures (too many distinct values to be a category).
    const attrs = new Set(REPORT.form.capstones.flatMap(c => c.gathers));
    return REPORT.columns.filter(c =>
      !REPORT.candidateKeys.includes(c.name) &&
      !attrs.has(c.name) &&
      c.distinct >= 2 && c.distinct <= Math.max(3, DATA.length * 0.5));
  }
  const inDrill = n => DRILL.some(d=>d.dim===n);
  function slice(){ return DATA.filter(r => DRILL.every(d => String(r[d.dim])===String(d.value))); }
  function members(dim, rows){                              // built ON DEMAND for the current slice
    const m = new Map();
    for(const r of rows){ const k = r[dim]==null?'—':String(r[dim]); m.set(k,(m.get(k)||0)+1); }
    return [...m.entries()].map(([value,count])=>({value,count})).sort((a,b)=>b.count-a.count);
  }

  window.tcDrill = (dim,value)=>{ DRILL.push({dim, value:String(value)}); renderNav(); };
  window.tcUp = (level)=>{ DRILL = DRILL.slice(0, level); renderNav(); };

  function renderNav(){
    const rows = slice();
    const remaining = facets().filter(c=>!inDrill(c.name));
    // breadcrumb
    let crumbs = '<button class="crumb'+(DRILL.length?'':' here')+'" onclick="tcUp(0)">All</button>';
    DRILL.forEach((d,i)=>{ crumbs += '<span class="csep">▸</span><button class="crumb'+(i===DRILL.length-1?' here':'')+'" onclick="tcUp('+(i+1)+')"><span class="d">'+esc(d.dim)+':</span> '+esc(d.value)+'</button>'; });

    // dimension cards (drill options), each with on-demand member counts for THIS slice
    let dimsHtml = remaining.length ? '<div class="dims">' + remaining.map(c=>{
      const ms = members(c.name, rows), top = ms.slice(0,12);
      const role = REPORT.form.capstones.some(x=>x.apex===c.name) ? 'entity dimension' : 'dimension';
      return '<div class="dim"><div class="dh"><span class="dn">'+esc(c.name)+'</span><span class="dc">'+role+' · '+ms.length+'</span></div>'
        + '<div class="members">' + top.map(m=>'<button class="mem" onclick="tcDrill(\''+esc(c.name).replace(/'/g,"&#39;")+'\',\''+esc(String(m.value)).replace(/'/g,"&#39;")+'\')"><b>'+esc(m.value)+'</b><span class="n">'+m.count+'</span></button>').join('')
        + (ms.length>top.length?'<span class="more">+'+(ms.length-top.length)+' more</span>':'') + '</div></div>';
    }).join('') + '</div>' : '<div class="empty">No more dimensions to drill here — this is a single point. Use retrieval or Analyze.</div>';

    out.innerHTML = ''
      + '<div class="crumbs">'+crumbs+'</div>'
      + '<div class="lead"><h2>'+(DRILL.length? 'Inside this slice' : 'Dimensions in '+esc(NAME))+'</h2><span class="fn">'+rows.length.toLocaleString()+' of '+DATA.length.toLocaleString()+' records</span></div>'
      + '<p class="teach">Drill a dimension to build the relationship on demand. Nothing was joined ahead of time.</p>'
      + dimsHtml
      + '<div class="row2">'
        + retrievalPanel(rows)
        + analyzePanel()
      + '</div>'
      + compressionPanel()
      + dataPanel(rows);

    wire();
  }

  function retrievalPanel(rows){
    const ids = REPORT.candidateKeys.length ? REPORT.candidateKeys : REPORT.columns.map(c=>c.name).slice(0,1);
    return '<div class="panel"><div class="ph"><h3>Instant retrieval</h3><span class="hint">go straight to one record</span></div><div class="pb">'
      + '<div class="lookrow">by <select class="sel" id="luf">'+ids.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select>'
      + '= <input class="inp" id="luv" placeholder="value" style="width:150px">'
      + '<button class="btn" id="lugo">Retrieve</button></div><div id="hit"></div></div></div>';
  }
  function analyzePanel(){
    return '<div class="panel"><div class="ph"><h3>Analyze</h3><span class="hint">structure of the current slice</span></div><div class="pb">'
      + '<button class="btn ghost" id="ango">Analyze this slice</button><div class="an" id="anout"></div></div></div>';
  }

  function compressionPanel(){
    const rec = REPORT.receipt, pct = Math.max(0, Math.round((1-rec.cellsSeeded/rec.cellsRaw)*100));
    return '<div class="comp"><div class="cl">Compression</div>'
      + '<div class="big">'+(pct>0?('-'+pct+'%'):'lossless')+'</div>'
      + '<div class="sub">Stored as a rule, not a pile of values: '+rec.cellsRaw.toLocaleString()+' cells kept as '+rec.cellsSeeded.toLocaleString()+'. It rebuilds every record exactly. (Structured data like time series shrinks far more.)</div>'
      + '<div class="act"><button class="btn" id="bloombtn">Bloom it back</button><span id="bloomres"></span></div></div>';
  }

  function dataPanel(rows){
    const names = REPORT.columns.map(c=>c.name);
    let h='<details class="data"><summary>The records ('+Math.min(rows.length,200)+' shown)</summary><div class="tblwrap"><table><thead><tr>';
    for(const c of REPORT.columns){ const role = REPORT.candidateKeys.includes(c.name)?'identity':(c.dim==='surface'?'linked':(c.kind==='numeric'?'measure':'dimension')); h+='<th>'+esc(c.name)+'<div style="font-size:.6rem;color:var(--mist-dim);font-weight:400">'+role+'</div></th>'; }
    h+='</tr></thead><tbody>';
    for(const r of rows.slice(0,200)){ h+='<tr>'; for(const n of names){ const v=r[n]; h+='<td'+(isNum(v)?' class="num"':'')+'>'+esc(v==null?'':v)+'</td>'; } h+='</tr>'; }
    return h+'</tbody></table></div></details>';
  }

  function wire(){
    const go=document.getElementById('lugo'), hit=document.getElementById('hit');
    if(go) go.onclick=()=>{ const f=document.getElementById('luf').value, v=document.getElementById('luv').value;
      const idx=DATA.findIndex(r=>String(r[f])===String(v));
      if(idx<0){ hit.innerHTML='<div class="empty">No record where '+esc(f)+' = '+esc(v)+'.</div>'; return; }
      const rec=DATA[idx];
      hit.innerHTML='<div class="addr">['+esc(f)+' = '+esc(v)+'] → record #'+idx+'</div><div class="kv">'+Object.entries(rec).map(([k,val])=>'<div class="k">'+esc(k)+'</div><div class="v">'+esc(val==null?'':val)+'</div>').join('')+'</div>'; };

    const an=document.getElementById('ango'), anout=document.getElementById('anout');
    if(an) an.onclick=()=>{ const rows=slice(); if(rows.length<2){ anout.innerHTML='<div class="empty">Drill less — need at least 2 records to analyze.</div>'; return; }
      const r=analyzeDataset(rows);
      const ents=[]; const seen=new Set();
      for(const c of r.form.capstones){ const sig=[c.apex,...c.gathers].sort().join('|'); if(!seen.has(sig)){seen.add(sig);ents.push(c);} }
      const rels=r.couplings.filter(c=>!r.candidateKeys.includes(c.from) && !ents.some(e=>[e.apex,...e.gathers].includes(c.from)&&[e.apex,...e.gathers].includes(c.to)));
      let h='';
      ents.forEach(e=>h+='<div class="rel"><span class="pill ent">'+esc(e.apex)+'</span><span class="desc">groups '+e.gathers.map(esc).join(', ')+' (stored once)</span></div>');
      rels.forEach(c=>h+='<div class="rel"><span class="pill">'+esc(c.from)+'</span><span class="arr">→</span><span class="pill">'+esc(c.to)+'</span></div>');
      h+='<div class="rel"><span class="desc">'+r.rank+' independent axis'+(r.rank>1?'es':'')+' · rebuilds '+(r.receipt.lossless?'exact':'—')+'</span></div>';
      anout.innerHTML = h || '<div class="empty">Independent fields, no hidden relationships in this slice.</div>'; };

    const bb=document.getElementById('bloombtn'), br=document.getElementById('bloomres');
    if(bb) bb.onclick=()=>{ const ok=REPORT.receipt.lossless;
      br.innerHTML='<span class="bloomed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Rebuilt all '+DATA.length.toLocaleString()+' records · '+(ok?'byte-for-byte identical':'MISMATCH')+'</span>'; };
  }

  // ---- file/sample loading ----
  function fromFile(f){ if(!f) return; f.text().then(t=>{ let rows; const nm=f.name||'dataset';
    if(/\.json$/i.test(nm)||t.trim().startsWith('[')){ const j=JSON.parse(t); rows=Array.isArray(j)?j:(j.rows||j.data||[]); }
    else rows=parseCSV(t);
    analyze(rows, nm); }); }

  fetch('samples/index.json').then(r=>r.json()).then(list=>{
    const host=document.getElementById('samples');
    host.innerHTML=list.map(s=>'<button class="link" data-f="'+s.file+'" data-l="'+s.label+'">'+s.label+'</button>').join(' &middot; ');
    host.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();
      fetch('samples/'+b.getAttribute('data-f')).then(r=>r.json()).then(rows=>analyze(rows,b.getAttribute('data-l')));});
  }).catch(()=>{ document.getElementById('samples').textContent='(run the preview server to load samples)'; });

  document.getElementById('pick').onclick=e=>{e.stopPropagation();fileEl.click();};
  drop.onclick=()=>fileEl.click();
  drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileEl.click();}});
  fileEl.onchange=()=>fromFile(fileEl.files&&fileEl.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
  drop.addEventListener('drop',e=>fromFile(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]));
</script>
